# ssqch's Sass for the Node build (0.8): grass, the compiler 0.7's plugins/sass used, at the same
# version, built for wasm32-wasip1 and committed as packages/ssqch/wasm/sass.wasm, so a site's CSS
# comes out as 0.7 wrote it. Rebuild it with `node packages/ssqch/scripts/build-wasm.ts sass`.
[package]
name = "ssqch-sass"
description = "ssqch's built-in Sass (grass), as WebAssembly for the Node build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# As plugins/sass has it.
grass = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }

# The wasm reads the options as JSON.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json.workspace = true
