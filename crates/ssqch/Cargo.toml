[package]
name = "ssqch"
description = "The SiteSquatch command-line tool, configured by ssqch.config.js or sitesquatch.toml"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["static-site", "ssg", "blog", "cli", "markdown"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "ssqch"
path = "src/main.rs"

[features]
default = ["liquid", "jinja", "handlebars", "sass", "fetch"]
avif = ["sitesquatch-plugin-image/avif"]
# Liquid templates (`.liquid`).
liquid = ["dep:sitesquatch-plugin-liquid"]
# Nunjucks and Jinja templates (`.njk`, `.jinja`, `.j2`).
jinja = ["dep:sitesquatch-plugin-jinja"]
# Handlebars and Mustache templates (`.hbs`, `.handlebars`, `.mustache`).
handlebars = ["dep:sitesquatch-plugin-handlebars"]
# Sass (`ssqch/sass`), about 2.7 MB.
sass = ["dep:sitesquatch-plugin-sass"]
# `fetch()` in config and data files, about 2.3 MB.
fetch = ["sitesquatch-js/fetch"]

# Release builds include AVIF support (see dist-workspace.toml).
[package.metadata.dist]
features = ["avif"]

# `cargo binstall ssqch` downloads the release archive instead of compiling.
# dist's archives are `ssqch-<target>.tar.gz` with the binary in a
# `ssqch-<target>/` folder; the Windows zip has `ssqch.exe` at the top.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
anyhow.workspace = true
regex.workspace = true
serde_json.workspace = true
toml = "0.8"
walkdir = "2"
sitesquatch.workspace = true
sitesquatch-js.workspace = true
sitesquatch-plugin-rss.workspace = true
sitesquatch-plugin-image.workspace = true
sitesquatch-plugin-minify.workspace = true
sitesquatch-plugin-assets.workspace = true
sitesquatch-plugin-links.workspace = true
sitesquatch-plugin-sitemap.workspace = true
sitesquatch-plugin-redirects.workspace = true
sitesquatch-plugin-elements.workspace = true
sitesquatch-plugin-sass = { workspace = true, optional = true }
sitesquatch-plugin-liquid = { workspace = true, optional = true }
sitesquatch-plugin-jinja = { workspace = true, optional = true }
sitesquatch-plugin-handlebars = { workspace = true, optional = true }

# The allocator for static musl builds (see main.rs).
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"
