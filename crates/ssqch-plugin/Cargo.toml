# The SDK for ssqch plugins written in Rust: a plugin is a `.wasm` file (wasm32-wasip1) that ssqch
# 0.8 runs in Node's WebAssembly, on every platform. ssqch's own minifier is built with it
# (crates/ssqch-minify), and so is the example in examples/rust-plugin.
#
# It's published to crates.io with each ssqch release, at ssqch's version (by hand, from the tag:
# `cargo publish -p ssqch-plugin`; AGENTS.md, "Releasing").
[package]
name = "ssqch-plugin"
description = "Write ssqch plugins in Rust: transforms, filters and template engines, built as one .wasm file that runs everywhere"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/ssqch-plugin"
readme = "README.md"
keywords = ["ssqch", "static-site", "plugin", "wasm"]
categories = ["wasm", "web-programming", "template-engine"]
# `#[unsafe(no_mangle)]` in what `export!` writes, and `&mut` in the manifest's const fns.
rust-version = "1.83"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Objects keep their keys in the order JavaScript gave them, as they would in a JavaScript filter.
serde_json = { version = "1", features = ["preserve_order"] }
