<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  /* Ranger Station '76: soft white (or green charcoal), neutral text, pine headings, burnt orange links. */
  :root { color-scheme: light dark; --ink: #29332c; --heading: #233b2b; --soft: #5e6a61; --paper: #fafaf7; --link: #a23e20; --gold: #e8af43; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e5e9e1; --heading: #d6e4c8; --soft: #a2aca3; --paper: #1b201d; --link: #f0a17d; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
  main { max-width: 32rem; padding: 2rem 1rem; text-align: center; }
  svg { width: 9rem; height: auto; }
  h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; color: var(--heading); }
  code { font-size: 0.95em; overflow-wrap: anywhere; }
  a { color: var(--link); text-decoration: underline; text-underline-offset: 0.18em; }
  h1::after { content: ""; display: block; width: 4rem; height: 4px; margin: 0.6rem auto 0; background: var(--gold); }
  small { display: block; margin-top: 2rem; color: var(--soft); }
</style>
</head>
<body>
<main>
  {{patch}}
  <h1>Page not found</h1>
  <p>The trail goes cold at <code>{{url}}</code>. We have several eyewitness accounts of this page, but no page.</p>
  {{suggestion}}
  <p><a href="{{home}}">Back to the trailhead</a></p>
  <small>From <code>ssqch serve</code>, because this site has no <code>404.html</code>. Add a page with <code>permalink: /404.html</code> to make your own.</small>
</main>
</body>
</html>
