<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Page not found</title>
<style>
  :root { color-scheme: light dark; --ink: #1f2937; --soft: #6b7280; --paper: #f8f7f2; --moss: #3f6b3a; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e5e7eb; --soft: #9ca3af; --paper: #151a16; --moss: #8fbf7f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
  main { max-width: 32rem; padding: 2rem 1rem; text-align: center; }
  svg { width: 7rem; height: auto; fill: var(--moss); transform: rotate(12deg); }
  h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
  code { font-size: 0.95em; overflow-wrap: anywhere; }
  a { color: var(--moss); }
  small { display: block; margin-top: 2rem; color: var(--soft); }
</style>
</head>

</main>
</body>
</html>
