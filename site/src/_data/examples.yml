# The example sites (examples/sites/), in the order examples/sites/README.md lists them, and the
# one source for everything the site says about them: the landing page's campsites, the gallery
# at /examples/, the "See it working" box on a docs page that one of them shows, and the trail
# marker site/build.ts puts at the top of each live example. Each is built under
# /examples/<name>/. `features` link to the docs page that explains each (the build's link
# checker checks them), and `from` is the real site each was distilled from (its README).
# tests/examples.test.ts checks this list against examples/sites/.
- name: blog-tags
  engine: Nunjucks
  from: blog.rust-lang.org (Zola)
  shows: Dated permalinks, tag pages with a feed each, aliases, footnotes, highlighting.
  features:
    - { label: Dated permalinks from directory data, docs: /docs/templates/ }
    - { label: A page and a feed per tag, by pagination, docs: /docs/templates/ }
    - { label: Atom feeds and a sitemap, docs: /docs/plugins/ }
    - { label: Redirects from old URLs, docs: /docs/plugins/ }
    - { label: Footnotes and highlighting, docs: /docs/markdown/ }
- name: blog-categories
  engine: Nunjucks
  from: eslint.org (Eleventy)
  shows: Category pages from a custom collection, reading time, excerpts, an Atom feed.
  features:
    - { label: Category pages from a custom collection, docs: /docs/configuring/ }
    - { label: Reading time and excerpts, docs: /docs/templates/ }
    - { label: An Atom feed, docs: /docs/plugins/ }
    - { label: A site chosen by an environment variable, docs: /docs/data-files/ }
- name: docs-sidebar
  engine: Nunjucks
  from: hexo.io (Hexo) and the FastAPI docs (MkDocs)
  shows: A sidebar, breadcrumbs and previous/next from one file, admonitions, Pagefind search.
  features:
    - { label: A sidebar, breadcrumbs and previous and next from one file, docs: /docs/templates/ }
    - { label: A table of contents and heading anchors, docs: /docs/markdown/ }
    - { label: Pagefind search, docs: /docs/deploying/#search }
- name: glossary-docs
  engine: Nunjucks
  from: kubernetes.io (Hugo)
  shows: A headless glossary with tooltips, callout containers, generated redirects.
  features:
    - { label: Callouts as containers, docs: /docs/markdown/ }
    - { label: Generated redirects, docs: /docs/plugins/ }
    - { label: Pages with no page of their own (permalink false), docs: /docs/templates/ }
- name: versioned-docs
  engine: Jinja
  from: reactnative.dev (Docusaurus)
  shows: Versions as folders with their own sidebars, a version switcher, tabs, a blog with authors.
  features:
    - { label: Versions as folders, with directory data, docs: /docs/templates/ }
    - { label: Tabs from containers, docs: /docs/markdown/ }
    - { label: Jinja templates, docs: /docs/template-languages/#jinja-and-nunjucks }
- name: component-docs
  engine: Edge
  from: getbootstrap.com (Hugo)
  shows: Edge components in place of MDX, live examples with highlighted source, Sass.
  features:
    - { label: Edge components in Markdown pages, docs: /docs/template-languages/#edge }
    - { label: Live examples from containers, docs: /docs/markdown/ }
    - { label: Sass, docs: /docs/css-and-javascript/ }
- name: islands
  engine: Jinja
  from: what an Astro or Eleventy "islands" site looks like
  shows: Custom elements whose scripts load only on the pages that use them, each with a fallback.
  features:
    - { label: Custom elements that load only where they're used, docs: /docs/plugins/ }
    - { label: Serving a site under a path, docs: /docs/deploying/#serving-a-site-under-a-path }
- name: jekyll-guides
  engine: Liquid
  from: opensource.guide and www.ruby-lang.org (Jekyll)
  shows: A Jekyll site as it's laid out, its layouts run as written, with kramdown's Markdown.
  features:
    - { label: "Jekyll's page and site (jekyllTemplates)", docs: /docs/configuring/ }
    - { label: "Markdown inside HTML (markdown=\"1\") and kramdown's heading ids", docs: /docs/markdown/ }
    - { label: "Jekyll's highlight, link and post_url tags", docs: /docs/trailheads/from-jekyll/ }
- name: reference-pages
  engine: Handlebars
  from: the TSConfig reference on typescriptlang.org
  shows: One page per option, generated from a JSON schema and grouped by category.
  features:
    - { label: One page per item, by pagination, docs: /docs/templates/ }
    - { label: Data from a JSON schema, docs: /docs/data-files/ }
    - { label: Handlebars templates, docs: /docs/template-languages/#handlebars-and-mustache }
