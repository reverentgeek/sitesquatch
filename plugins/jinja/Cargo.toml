[package]
name = "sitesquatch-plugin-jinja"
description = "Nunjucks and Jinja templates for SiteSquatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
sitesquatch.workspace = true
regex.workspace = true
walkdir = "2"
minijinja = { version = "3", features = ["json", "urlencode", "loop_controls", "preserve_order", "speedups"] }
chrono.workspace = true
minijinja-contrib = { version = "3", features = ["pycompat"] }
