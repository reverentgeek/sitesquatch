[workspace]
resolver = "2"
members = ["crates/*", "plugins/*", "examples/*"]
# Example sites (built by crates/ssqch/tests/examples.rs), not crates.
exclude = ["examples/sites"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/reverentgeek/sitesquatch"
homepage = "https://github.com/reverentgeek/sitesquatch"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
indexmap = "2"
rayon = "1"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
lol_html = "2"
sitesquatch = { version = "0.5.0", path = "crates/sitesquatch" }
sitesquatch-edge = { version = "0.5.0", path = "crates/sitesquatch-edge" }
sitesquatch-js = { version = "0.5.0", path = "crates/sitesquatch-js", default-features = false }
sitesquatch-plugin-rss = { version = "0.5.0", path = "plugins/rss" }
sitesquatch-plugin-image = { version = "0.5.0", path = "plugins/image" }
sitesquatch-plugin-minify = { version = "0.5.0", path = "plugins/minify" }
sitesquatch-plugin-assets = { version = "0.5.0", path = "plugins/assets" }
sitesquatch-plugin-links = { version = "0.5.0", path = "plugins/links" }
sitesquatch-plugin-sitemap = { version = "0.5.0", path = "plugins/sitemap" }
sitesquatch-plugin-redirects = { version = "0.5.0", path = "plugins/redirects" }
sitesquatch-plugin-sass = { version = "0.5.0", path = "plugins/sass" }
sitesquatch-plugin-elements = { version = "0.5.0", path = "plugins/elements" }
sitesquatch-plugin-liquid = { version = "0.5.0", path = "plugins/liquid" }
sitesquatch-plugin-jinja = { version = "0.5.0", path = "plugins/jinja" }
sitesquatch-plugin-handlebars = { version = "0.5.0", path = "plugins/handlebars" }

[profile.release]
lto = "thin"
codegen-units = 4

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
