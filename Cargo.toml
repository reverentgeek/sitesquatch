[workspace]
resolver = "2"
# ssqch's own Markdown, minifier and Sass, built as WebAssembly for the Node build
# (packages/ssqch/scripts/build-wasm.ts), the SDK for plugins written in Rust, and its example.
members = ["crates/*", "examples/rust-plugin"]

[workspace.package]
version = "0.13.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/reverentgeek/sitesquatch"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
indexmap = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 4

# The Node build's Markdown (crates/ssqch-markdown as packages/ssqch/wasm/markdown.wasm), from
# packages/ssqch/scripts/build-wasm.ts: one unit, so the file is small and fast. A panic in the
# wasm traps, and Node starts a fresh instance.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
