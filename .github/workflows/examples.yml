# Builds the example sites in examples/sites/ with this commit's ssqch and
# deploys each one to its own Netlify site (eventually <name>.sitesquatch.dev).
#
# Each example needs a Netlify site, and the repository needs:
#   - secret NETLIFY_AUTH_TOKEN: a Netlify personal access token
#   - a variable per example with its site's ID (Site configuration > General
#     > Site ID in Netlify): NETLIFY_SITE_BLOG_TAGS, NETLIFY_SITE_BLOG_CATEGORIES,
#     NETLIFY_SITE_DOCS_SIDEBAR, NETLIFY_SITE_GLOSSARY_DOCS,
#     NETLIFY_SITE_VERSIONED_DOCS, NETLIFY_SITE_COMPONENT_DOCS,
#     NETLIFY_SITE_REFERENCE_PAGES and NETLIFY_SITE_ISLANDS
# Until they're set, the workflow builds the examples and skips deploying.
#
# The examples deploy from main, built with the ssqch in the same commit.
name: Examples

on:
  push:
    branches: [main]
    paths: [examples/sites/**, crates/**, plugins/**, Cargo.toml, Cargo.lock, .github/workflows/examples.yml]
  workflow_dispatch:

concurrency:
  group: examples
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: examples
      # No AVIF: the examples have no images to encode.
      - run: cargo build --release --locked -p ssqch
      - name: Build the examples
        run: |
          for site in examples/sites/*/; do
            echo "::group::$site"
            target/release/ssqch build --root "$site"
            echo "::endgroup::"
          done
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_blog_tags: ${{ vars.NETLIFY_SITE_BLOG_TAGS }}
          SITE_blog_categories: ${{ vars.NETLIFY_SITE_BLOG_CATEGORIES }}
          SITE_docs_sidebar: ${{ vars.NETLIFY_SITE_DOCS_SIDEBAR }}
          SITE_glossary_docs: ${{ vars.NETLIFY_SITE_GLOSSARY_DOCS }}
          SITE_versioned_docs: ${{ vars.NETLIFY_SITE_VERSIONED_DOCS }}
          SITE_component_docs: ${{ vars.NETLIFY_SITE_COMPONENT_DOCS }}
          SITE_reference_pages: ${{ vars.NETLIFY_SITE_REFERENCE_PAGES }}
          SITE_islands: ${{ vars.NETLIFY_SITE_ISLANDS }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN isn't set, so the examples were built but not deployed."
            exit 0
          fi
          for site in examples/sites/*/; do
            name=$(basename "$site")
            var="SITE_${name//-/_}"
            id="${!var}"
            if [ -z "$id" ]; then
              echo "::warning::No Netlify site ID for $name (variable NETLIFY_SITE_$(echo "${name//-/_}" | tr a-z A-Z)); skipped."
              continue
            fi
            (cd "$site/dist" && zip -qr "$RUNNER_TEMP/$name.zip" .)
            # A zip upload to the deploys API publishes it as the production deploy.
            url=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/zip" \
              --data-binary "@$RUNNER_TEMP/$name.zip" "https://api.netlify.com/api/v1/sites/$id/deploys" | jq -r '.ssl_url // .url')
            echo "$name: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          done
