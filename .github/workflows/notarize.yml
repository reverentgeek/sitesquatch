# Notarizes the signed macOS executables with Apple, so Gatekeeper lets them run when they're
# downloaded with a browser. release.yml signs them while building (build-sea.ts --sign, with the
# hardened runtime and scripts/sea-entitlements.plist) and calls this for a tag; if it fails, the
# release isn't published.
#
# A bare command-line executable can't have a notarization ticket stapled to it. Gatekeeper looks
# the ticket up online instead, so the archives don't change after signing.
#
# Secrets (the same names as in reverentgeek/metermaid): APPLE_ID (the Apple ID's email), APPLE_PASSWORD
# (an app-specific password for it) and APPLE_TEAM_ID (the 10-character Developer Team ID).
name: Notarize

on:
  workflow_call:

jobs:
  notarize:
    name: notarize (${{ matrix.target }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: executable-${{ matrix.target }}
          path: archives
      - name: Unpack the executable
        run: |
          mkdir unpacked
          tar xzf "archives/ssqch-${{ matrix.target }}.tar.gz" -C unpacked
          cp "unpacked/ssqch-${{ matrix.target }}/ssqch" .
      - name: Check the signature
        run: |
          codesign --verify --strict --verbose=2 ssqch
          info=$(codesign --display --verbose=4 ssqch 2>&1)
          echo "$info"
          echo "$info" | grep -q "^Authority=Developer ID Application" || { echo "::error::not signed with a Developer ID Application certificate"; exit 1; }
          echo "$info" | grep -q "^Timestamp=" || { echo "::error::the signature has no secure timestamp, which notarization requires"; exit 1; }
          echo "$info" | grep -q "flags=.*runtime" || { echo "::error::the signature doesn't use the hardened runtime"; exit 1; }
          # V8 needs to write machine code under the hardened runtime, and the notary service
          # refuses an executable a debugger may attach to.
          entitlements=$(codesign --display --entitlements - --xml ssqch 2>/dev/null)
          echo "$entitlements" | grep -q "com.apple.security.cs.allow-jit" || { echo "::error::the signature has no allow-jit entitlement, so V8 can't run (scripts/sea-entitlements.plist)"; exit 1; }
          if echo "$entitlements" | grep -q "get-task-allow"; then echo "::error::the signature has get-task-allow, which notarization refuses"; exit 1; fi
      - name: Submit to Apple's notary service
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::the $v secret isn't set"; exit 1; }
          done
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          ditto -c -k ssqch ssqch.zip
          xcrun notarytool submit ssqch.zip "${auth[@]}" --wait --timeout 30m --output-format json | tee result.json
          id=$(python3 -c 'import json; print(json.load(open("result.json"))["id"])')
          xcrun notarytool log "$id" "${auth[@]}"
          status=$(python3 -c 'import json; print(json.load(open("result.json"))["status"])')
          [ "$status" = Accepted ] || { echo "::error::notarization status: $status"; exit 1; }
      - name: Gatekeeper accepts it
        run: |
          # As if it came from a browser download. A command-line tool isn't an
          # app, so `--type execute` always rejects it; Gatekeeper checks a
          # downloaded tool's primary signature, which must be notarized.
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" ssqch
          # Apple can take a few minutes to publish the ticket after notarytool
          # says "Accepted" (0.6.4's Intel build was "Unnotarized" 4 seconds
          # later), so check again for up to five minutes before failing.
          for attempt in $(seq 1 15); do
            result=$(spctl --assess --type open --context context:primary-signature --verbose=4 ssqch 2>&1) || true
            echo "$result"
            if echo "$result" | grep -q "accepted" && echo "$result" | grep -q "source=Notarized Developer ID"; then
              exit 0
            fi
            echo "Attempt $attempt: not accepted as notarized yet; checking again in 20 seconds."
            sleep 20
          done
          echo "::error::Gatekeeper doesn't accept the executable as notarized"
          exit 1
      # Quarantined, as a download is, it runs (and unpacks itself) on Apple silicon; the Intel
      # one is checked by the smoke test on its own runner.
      - name: The quarantined executable runs
        if: matrix.target == 'aarch64-apple-darwin'
        run: SSQCH_UNPACK_DIR="$RUNNER_TEMP/unpack" ./ssqch --version
