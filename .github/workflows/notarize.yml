# Notarizes the signed macOS binaries with Apple, so Gatekeeper lets them run
# when they're downloaded with a browser. dist signs them while building
# (`macos-sign` in dist-workspace.toml) and calls this afterwards
# (`global-artifacts-jobs`); if it fails, the release isn't published.
#
# A bare command-line binary can't have a notarization ticket stapled to it.
# Gatekeeper looks the ticket up online instead, so the archives don't change
# after signing.
#
# Secrets (the same names as in reverentgeek/metermaid): APPLE_ID (the Apple
# ID's email), APPLE_PASSWORD (an app-specific password for it) and
# APPLE_TEAM_ID (the 10-character Developer Team ID).
name: Notarize

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  notarize:
    name: notarize (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: artifacts
      - name: Unpack the binary
        run: |
          mkdir unpacked
          tar xzf "artifacts/ssqch-${{ matrix.target }}.tar.gz" -C unpacked
          cp "unpacked/ssqch-${{ matrix.target }}/ssqch" .
      - name: Check the signature
        run: |
          codesign --verify --strict --verbose=2 ssqch
          info=$(codesign --display --verbose=4 ssqch 2>&1)
          echo "$info"
          echo "$info" | grep -q "^Authority=Developer ID Application" || { echo "::error::not signed with a Developer ID Application certificate"; exit 1; }
          echo "$info" | grep -q "^Timestamp=" || { echo "::error::the signature has no secure timestamp, which notarization requires"; exit 1; }
          echo "$info" | grep -q "flags=.*runtime" || { echo "::error::the signature doesn't use the hardened runtime (CODESIGN_OPTIONS=runtime)"; exit 1; }
      - name: Submit to Apple's notary service
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::the $v secret isn't set"; exit 1; }
          done
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          ditto -c -k ssqch ssqch.zip
          xcrun notarytool submit ssqch.zip "${auth[@]}" --wait --timeout 30m --output-format json | tee result.json
          id=$(python3 -c 'import json; print(json.load(open("result.json"))["id"])')
          xcrun notarytool log "$id" "${auth[@]}"
          status=$(python3 -c 'import json; print(json.load(open("result.json"))["status"])')
          [ "$status" = Accepted ] || { echo "::error::notarization status: $status"; exit 1; }
      - name: Gatekeeper accepts it
        run: |
          # As if it came from a browser download.
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" ssqch
          spctl --assess --type execute --verbose=4 ssqch
