# Publishes the npm package after the GitHub release is created: the tarball the release
# workflow packed and tested (packages/ssqch/scripts/build.ts), one package, `ssqch`, with sharp
# as its only dependency. release.yml calls it once the release is out.
#
# It uses npm's trusted publishing (GitHub's OIDC token, no npm token stored here), which also
# adds provenance. `ssqch` on npmjs.com names reverentgeek/sitesquatch and `release.yml` as its
# trusted publisher: npm checks the calling workflow, not this one. A version that's already on
# npm is skipped, so the job can be rerun.
name: Publish to npm

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) can't use trusted publishing (it needs 11.5.1 or later)"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-package
      - name: Publish
        run: |
          # `./`: npm reads `npm-package/ssqch-<version>.tgz` as a GitHub repository (user/repo),
          # not a file, and tries to clone it (v0.8.0's first run did).
          tarball="./npm-package/ssqch-$VERSION.tgz"
          [ -f "$tarball" ] || { echo "::error::$tarball isn't there"; ls npm-package; exit 1; }
          # A prerelease (0.8.0-rc.1) goes under the `next` tag, so `npm install ssqch` keeps
          # getting the latest release.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          if [ "$(npm view "ssqch@$VERSION" version --prefer-online 2>/dev/null)" = "$VERSION" ]; then
            echo "ssqch@$VERSION is already on npm"
            exit 0
          fi
          npm publish "$tarball" --access public --provenance --tag "$tag"
