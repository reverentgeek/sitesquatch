# Publishes the npm packages after the GitHub release is created: `ssqch`, a
# small wrapper, and one `@ssqch/<platform>-<arch>` package per release binary,
# which the wrapper lists as optional dependencies (scripts/npm-packages.mjs
# builds them from the release archives). dist calls this as a publish job
# (`publish-jobs` in dist-workspace.toml), so it runs only once the release is
# out, and the smoke test has already installed each platform's package.
#
# It uses npm's trusted publishing (GitHub's OIDC token, no npm token stored
# here), which also adds provenance. Each of the five packages on npmjs.com names
# reverentgeek/sitesquatch and `release.yml` as its trusted publisher: npm checks
# the calling workflow, not this one. A package has to exist before it can have
# one, so each was first published by hand (see AGENTS.md). A version that's
# already on npm is skipped, so the job can be rerun.
name: Publish to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) can't use trusted publishing (it needs 11.5.1 or later)"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: artifacts
          merge-multiple: true
      - name: Build the packages
        run: |
          version=$(echo "$PLAN" | jq -r '.releases[] | select(.app_name == "ssqch") | .app_version')
          [ -n "$version" ] || { echo "::error::the plan has no ssqch release"; exit 1; }
          echo "version=$version" >> "$GITHUB_ENV"
          node scripts/npm-packages.mjs --archives artifacts --out npm-out --version "$version"
      - name: Publish
        run: |
          # A prerelease (0.6.0-beta.1) goes under the `next` tag, so `npm install
          # ssqch` keeps getting the latest release.
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          # The platform packages first: the wrapper depends on them.
          for dir in npm-out/*-* npm-out/ssqch; do
            name=$(jq -r .name "$dir/package.json")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "$dir" && npm publish --access public --tag "$tag")
          done
