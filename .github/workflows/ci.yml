# Tests and lints on every push to main or a release/* branch, and every pull request.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ssqch (packages/ssqch), on the lowest Node it supports and the two after it: the type check,
  # the unit tests, and the oracle (tests/oracle), black-box tests and the sites' frozen output.
  node:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: packages/ssqch
      - name: type check
        if: runner.os == 'Linux' && matrix.node == 24
        working-directory: packages/ssqch
        run: npx tsc --noEmit
      - name: unit tests
        working-directory: packages/ssqch
        run: node --test
      - name: oracle
        working-directory: tests/oracle
        run: node --test --test-concurrency=4

  # The npm package as a site gets it (packages/ssqch/scripts/build.ts, then `npm pack`), installed
  # from its tarball into an empty folder: every example, a starter, and a site with images, the
  # .wasm files and a Rust plugin build to the bytes the source builds (scripts/check-package.ts).
  # On the lowest Node, the oracle runs against it too. Node doesn't strip types under
  # node_modules, so this is what catches a package that works from the repository and not from npm.
  # Linux only: the package is the same JavaScript everywhere, and the `node` job already runs the
  # code and the oracle on macOS and Windows.
  package:
    name: package (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: packages/ssqch
      - name: build and pack
        working-directory: packages/ssqch
        run: |
          node scripts/build.ts
          npm pack ./dist --pack-destination "$RUNNER_TEMP"
      - name: install the tarball and build with it
        run: node packages/ssqch/scripts/check-package.ts --tarball "$RUNNER_TEMP/ssqch-$(node -p 'require("./packages/ssqch/package.json").version').tgz" ${{ matrix.node == '22.18.0' && '--oracle' || '' }}

  # Speed is part of done: this commit's Node build against its parent's (a pull request's
  # merge against its base), on the same runner, building the 10,000-page site on one thread.
  # A change that makes it more than 15% slower fails. ssqch 0.7.0 from npm is timed for the
  # record. packages/ssqch/bench/bench.ts says why CI compares rather than checks a time.
  node-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - run: npm ci
        working-directory: packages/ssqch
      - name: the parent commit's Node build
        run: |
          git worktree add "$RUNNER_TEMP/before" HEAD^1
          if [ -f "$RUNNER_TEMP/before/packages/ssqch/package-lock.json" ]; then npm ci --prefix "$RUNNER_TEMP/before/packages/ssqch"; fi
      - run: npm install --prefix "$RUNNER_TEMP/ssqch-07" ssqch@0.7.0
      - working-directory: packages/ssqch
        run: node bench/bench.ts --baseline "$RUNNER_TEMP/before/packages/ssqch" --reference "$RUNNER_TEMP/ssqch-07/node_modules/@ssqch/linux-x64/bin/ssqch"

  # The Rust that's left: ssqch's Markdown, minifier and Sass (crates/ssqch-markdown,
  # ssqch-minify, ssqch-sass), the plugin SDK (crates/ssqch-plugin) and its example
  # (examples/rust-plugin). Their tests run natively; clippy checks them natively and for
  # wasm32-wasip1, which is the code the .wasm files are built from (the exports Node calls are
  # compiled only there). That the committed .wasm files are built from this Rust is checked by
  # the `node` job, without Rust (scripts/wasm-inputs.test.ts).
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --lib --locked --target wasm32-wasip1 -- -D warnings
