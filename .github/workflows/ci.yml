# Tests and lints on every push to main or a release/* branch, and every pull request, except
# one that only changes what CI's matrix doesn't read: the website (site/ and its workflow),
# which site.yml checks and deploys with this commit's ssqch, and the repository's own prose
# (the README, CONTRIBUTING.md, AGENTS.md, TODO.md, CHANGELOG.md and docs/). The docs pages
# (site/src/docs/) are the exception: `ssqch docs` reads them and the package carries them, so a
# change to one runs CI. A release commit changes packages/ssqch/package.json, so CI always runs
# on what check-ci.yml waits for. A path that matches a later pattern follows that one.
name: CI

on:
  push:
    branches: [main, "release/**"]
    paths: ["**", "!site/**", "site/src/docs/**", "!.github/workflows/site.yml", "!README.md", "!CONTRIBUTING.md", "!AGENTS.md", "!TODO.md", "!CHANGELOG.md", "!docs/**"]
  pull_request:
    paths: ["**", "!site/**", "site/src/docs/**", "!.github/workflows/site.yml", "!README.md", "!CONTRIBUTING.md", "!AGENTS.md", "!TODO.md", "!CHANGELOG.md", "!docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A push whose files a pull request's CI already passed with (GitHub tests a pull request as it
  # would be merged, so its merge commit has the same tree) runs nothing again: the jobs below are
  # skipped and the run passes, which check-ci.yml accepts for a tag. `tested` records each tree
  # that passed. If main moved after the pull request was tested, the tree differs and all of CI
  # runs. A release ran CI four times, and each run was a chance for a slow runner to fail.
  already-tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.look.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$GITHUB_EVENT_NAME" != push ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A passing run's record of this tree, if there is one.
          runs=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree&per_page=20" --jq '.artifacts[] | select(.expired == false) | .workflow_run.id')
          for run in $runs; do
            if [ "$(gh api "repos/$REPO/actions/runs/$run" --jq .conclusion)" = success ]; then
              echo "This tree ($tree) passed CI in run $run: https://github.com/$REPO/actions/runs/$run"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No passing run has this tree ($tree): running CI."
          echo "skip=false" >> "$GITHUB_OUTPUT"

  # ssqch (packages/ssqch), on the lowest Node it supports and the two after it: the type check,
  # the unit tests, and the oracle (tests/oracle), black-box tests and the sites' frozen output.
  node:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: packages/ssqch
      - name: type check
        if: runner.os == 'Linux' && matrix.node == 24
        working-directory: packages/ssqch
        run: npx tsc --noEmit
      - name: unit tests
        working-directory: packages/ssqch
        run: node --test
      - name: oracle
        working-directory: tests/oracle
        run: node --test --test-concurrency=4

  # The npm package as a site gets it (packages/ssqch/scripts/build.ts, then `npm pack`), installed
  # from its tarball into an empty folder: every example, a starter, and a site with images, the
  # .wasm files and a Rust plugin build to the bytes the source builds (scripts/check-package.ts).
  # On the lowest Node, the oracle runs against it too. Node doesn't strip types under
  # node_modules, so this is what catches a package that works from the repository and not from npm.
  # Linux only: the package is the same JavaScript everywhere, and the `node` job already runs the
  # code and the oracle on macOS and Windows.
  package:
    name: package (node ${{ matrix.node }})
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: packages/ssqch
      - name: build and pack
        working-directory: packages/ssqch
        run: |
          node scripts/build.ts
          npm pack ./dist --pack-destination "$RUNNER_TEMP"
      - name: install the tarball and build with it
        run: node packages/ssqch/scripts/check-package.ts --tarball "$RUNNER_TEMP/ssqch-$(node -p 'require("./packages/ssqch/package.json").version').tgz" ${{ matrix.node == '22.18.0' && '--oracle' || '' }}

  # Speed is part of done: this commit's Node build against its parent's (a pull request's
  # merge against its base), on the same runner, building the 10,000-page site on one thread.
  # A change that makes it more than 15% slower fails. ssqch 0.7.0 from npm is timed for the
  # record. packages/ssqch/bench/bench.ts says why CI compares rather than checks a time.
  node-benchmark:
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - run: npm ci
        working-directory: packages/ssqch
      - name: the parent commit's Node build
        run: |
          git worktree add "$RUNNER_TEMP/before" HEAD^1
          if [ -f "$RUNNER_TEMP/before/packages/ssqch/package-lock.json" ]; then npm ci --prefix "$RUNNER_TEMP/before/packages/ssqch"; fi
      - run: npm install --prefix "$RUNNER_TEMP/ssqch-07" ssqch@0.7.0
      - working-directory: packages/ssqch
        run: node bench/bench.ts --baseline "$RUNNER_TEMP/before/packages/ssqch" --reference "$RUNNER_TEMP/ssqch-07/node_modules/@ssqch/linux-x64/bin/ssqch"

  # The Rust that's left: ssqch's Markdown, minifier and Sass (crates/ssqch-markdown,
  # ssqch-minify, ssqch-sass), the plugin SDK (crates/ssqch-plugin) and its example
  # (examples/rust-plugin). Their tests run natively; clippy checks them natively and for
  # wasm32-wasip1, which is the code the .wasm files are built from (the exports Node calls are
  # compiled only there). That the committed .wasm files are built from this Rust is checked by
  # the `node` job, without Rust (scripts/wasm-inputs.test.ts).
  rust:
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --lib --locked --target wasm32-wasip1 -- -D warnings

  # Records the tree that passed, for `already-tested` (after every other job, so only a passing
  # run records one). On a pull request that's the tree its merge commit will have.
  tested:
    needs: [already-tested, node, package, node-benchmark, rust]
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - run: git rev-parse HEAD > tested-tree.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ env.tree }}
          path: tested-tree.txt
          retention-days: 30
