# Tests and lints on every push to main or a release/* branch, and every pull request.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.avif && ', avif' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        avif: [false]
        # The AVIF encoder is slow to compile, so only Linux tests it here. The
        # release builds include it on every platform and smoke-test it there.
        include:
          - os: ubuntu-latest
            avif: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.avif && 'avif' || 'default' }}
      # The AVIF encoder (rav1e) needs the nasm assembler on x86_64.
      - if: matrix.avif && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - run: cargo test --workspace --locked --no-fail-fast ${{ matrix.avif && '--features ssqch/avif' || '' }}
      # The oracle (tests/oracle): black-box tests and 0.7.0's frozen output, run against the
      # binary cargo test just built. On the lowest Node ssqch 0.8 will support.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - name: oracle
        working-directory: tests/oracle
        env:
          SSQCH_BIN: target/debug/ssqch${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node --test --test-concurrency=4

  # The Node implementation (packages/ssqch), being built beside the Rust one until the release
  # that switches (docs/node-migration.md). On the lowest Node it supports and the two after it.
  node:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.18.0, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: packages/ssqch
      - name: type check
        if: runner.os == 'Linux' && matrix.node == 24
        working-directory: packages/ssqch
        run: npx tsc --noEmit
      - name: unit tests
        working-directory: packages/ssqch
        run: node --test
      # The oracle's tests that the Node build passes so far (tests/oracle/node-passing.txt):
      # each stage of the move adds to the list, and nothing on it may fail again.
      - name: oracle
        working-directory: tests/oracle
        run: node progress.js

  # Speed is part of done: this commit's Node build against its parent's (a pull request's
  # merge against its base), on the same runner, building the 10,000-page site on one thread.
  # A change that makes it more than 15% slower fails. ssqch 0.7.0 from npm is timed for the
  # record. packages/ssqch/bench/bench.ts says why CI compares rather than checks a time.
  node-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
      - run: npm ci
        working-directory: packages/ssqch
      - name: the parent commit's Node build
        run: |
          git worktree add "$RUNNER_TEMP/before" HEAD^1
          if [ -f "$RUNNER_TEMP/before/packages/ssqch/package-lock.json" ]; then npm ci --prefix "$RUNNER_TEMP/before/packages/ssqch"; fi
      - run: npm install --prefix "$RUNNER_TEMP/ssqch-07" ssqch@0.7.0
      - working-directory: packages/ssqch
        run: node bench/bench.ts --baseline "$RUNNER_TEMP/before/packages/ssqch" --reference "$RUNNER_TEMP/ssqch-07/node_modules/@ssqch/linux-x64/bin/ssqch"

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - run: cargo clippy --workspace --all-targets --locked --features ssqch/avif -- -D warnings
