# Tests and lints on every push to main or a release/* branch, and every pull request.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.avif && ', avif' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        avif: [false]
        # The AVIF encoder is slow to compile, so only Linux tests it here. The
        # release builds include it on every platform and smoke-test it there.
        include:
          - os: ubuntu-latest
            avif: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.avif && 'avif' || 'default' }}
      # The AVIF encoder (rav1e) needs the nasm assembler on x86_64.
      - if: matrix.avif && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - run: cargo test --workspace --locked --no-fail-fast ${{ matrix.avif && '--features ssqch/avif' || '' }}

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nasm
      - run: cargo clippy --workspace --all-targets --locked --features ssqch/avif -- -D warnings
