# Releases ssqch from a version tag (`git tag v0.8.0 && git push origin v0.8.0`; AGENTS.md has
# the steps). ssqch ships through npm: the package, and a Homebrew formula that installs it with
# Homebrew's Node. Nothing is published unless every job before it passed:
#
#   plan          the tag is packages/ssqch/package.json's version, and CHANGELOG.md has its section
#   package       the npm package (packages/ssqch/scripts/build.ts), packed
#   npm-test      the packed package, installed with npm on Linux, on Node 22.18, 24 and 26: every
#                 example, a starter, images, the .wasm files, and the oracle's list
#                 (scripts/check-package.ts)
#   check-ci      CI passed on the tagged commit (check-ci.yml)
#   release       the GitHub release: the npm tarball and its checksum, with the changelog's
#                 section as its notes
#   npm           publishes the package with provenance (publish-npm.yml)
#   homebrew      updates Formula/ssqch.rb in reverentgeek/homebrew-tap, once the package is on npm
#
# `release` names every job before it in `needs` and has no `always()`, so it runs only when all
# of them succeeded: a failed or skipped job skips it, and the jobs after it. (dist's host job
# ran when builds were skipped, and a red commit got an empty release marked Latest: 0.3.4.)
#
# A pull request that changes how releases are built runs everything up to `release` (the paths
# below), so the builds are tried before a tag needs them.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/check-ci.yml
      - .github/workflows/publish-npm.yml
      - packages/ssqch/scripts/build.ts
      - packages/ssqch/scripts/check-package.ts
      - scripts/release-files.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publishing: ${{ steps.plan.outputs.publishing }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        run: |
          version=$(node -p 'require("./packages/ssqch/package.json").version')
          publishing=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME isn't packages/ssqch/package.json's version ($version). Set the version, commit, and tag that commit v$version."
              exit 1
            fi
            case "$version" in *-dev*) echo "::error::$version is a development version; set the release's version first."; exit 1 ;; esac
            publishing=true
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          # The release's notes: CHANGELOG.md's section for this version, from its heading
          # (`## 0.8.0 - 2026-12-01`) to the next one.
          awk -v v="$version" '
            index($0, "## " v " - ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            if [ "$publishing" = true ]; then
              echo "::error::CHANGELOG.md has no section for $version: rename \"## Unreleased\" to \"## $version - $(date -u +%F)\"."
              exit 1
            fi
            echo "(No changelog section for $version: this isn't a release.)" > notes.md
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publishing=$publishing"
          } >> "$GITHUB_OUTPUT"
          echo "ssqch $version (publishing: $publishing, prerelease: $prerelease)"
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  package:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: packages/ssqch
      - name: Build and pack the npm package
        working-directory: packages/ssqch
        env:
          RELEASE: ${{ needs.plan.outputs.publishing == 'true' && '--release' || '' }}
        run: |
          node scripts/build.ts $RELEASE
          mkdir -p "$GITHUB_WORKSPACE/out"
          npm pack ./dist --pack-destination "$GITHUB_WORKSPACE/out"
          ls -l "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: out/ssqch-*.tgz

  npm-test:
    name: npm-test (node ${{ matrix.node }})
    needs: [plan, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.18.0, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: packages/ssqch
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-package
      - name: Every example, a starter, images, the .wasm files and the oracle's list
        run: node packages/ssqch/scripts/check-package.ts --tarball "$(ls npm-package/ssqch-*.tgz)" --oracle

  check-ci:
    needs: [plan]
    if: needs.plan.outputs.publishing == 'true'
    uses: ./.github/workflows/check-ci.yml
    permissions:
      actions: read

  release:
    needs: [plan, package, npm-test, check-ci]
    if: needs.plan.outputs.publishing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The homebrew job needs it after the release is out, so it's checked before.
      - name: The Homebrew tap's token is set
        if: needs.plan.outputs.prerelease != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: '[ -n "$HOMEBREW_TAP_TOKEN" ] || { echo "::error::the HOMEBREW_TAP_TOKEN secret isn''t set"; exit 1; }'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: .
      - name: The Homebrew formula and the checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node scripts/release-files.mjs --version "$VERSION" --tarball "release/ssqch-$VERSION.tgz" --out extra
          cp extra/sha256.sum release/
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: extra/ssqch.rb
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md "${flags[@]}" release/*

  npm:
    needs: [plan, release]
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    # Trusted publishing signs in with the workflow's OIDC token; npm checks that it comes from
    # this file (release.yml), not publish-npm.yml.
    permissions:
      contents: read
      id-token: write

  # The formula installs the package from npm's registry, so it waits for the package to be there.
  homebrew:
    needs: [plan, release, npm]
    if: needs.plan.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula
          path: formula
      - uses: actions/checkout@v7
        with:
          repository: reverentgeek/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit Formula/ssqch.rb
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd tap
          mkdir -p Formula
          cp ../formula/ssqch.rb Formula/ssqch.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ssqch.rb
          if git diff --cached --quiet; then echo "Formula/ssqch.rb is already $VERSION"; exit 0; fi
          git commit -m "ssqch $VERSION"
          git push
