# TEMPORARY: compares allocators by building the ReverentGeek blog with three
# ssqch binaries on the same runner. Remove before merging.
#
#   musl-0.2.0     the v0.2.0 release (musl's own allocator)
#   musl-mimalloc  this branch, static musl build (mimalloc)
#   glibc          this branch, glibc build (glibc's allocator), for reference
#
# Each binary gets its own copy of the blog: one cold build (every image
# encoded, AVIF included) and three warm builds.
name: Allocator benchmark (temporary)

on:
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: reverentgeek/blog
          path: blog-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools nasm
      - name: Build the binaries
        run: |
          mkdir -p bin
          cargo build --release --locked -p ssqch --features avif --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/ssqch bin/musl-mimalloc
          cargo build --release --locked -p ssqch --features avif
          cp target/release/ssqch bin/glibc
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/reverentgeek/sitesquatch/releases/download/v0.2.0/ssqch-installer.sh \
            | SSQCH_UNMANAGED_INSTALL="$PWD/bin/release" sh
          mv bin/release/ssqch bin/musl-0.2.0
          file bin/*
      - name: Benchmark
        run: |
          nproc
          results=results.csv
          echo "binary,run,wall_s,maxrss_mb" > "$results"
          for b in musl-0.2.0 musl-mimalloc glibc; do
            rsync -a --exclude .git blog-src/ "work-$b/"
            for run in cold warm1 warm2 warm3; do
              start=$(date +%s.%N)
              /usr/bin/time -f "%M" -o rss.txt "bin/$b" build --root "work-$b" --env production > "log-$b-$run.txt" 2>&1
              end=$(date +%s.%N)
              echo "$b,$run,$(echo "$end - $start" | bc),$(( $(cat rss.txt) / 1024 ))" >> "$results"
              echo "== $b $run"
              grep -A6 "^Built in" "log-$b-$run.txt"
            done
          done
          python3 - "$results" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, statistics, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          print("| Binary | Cold build | Warm build (median of 3) | Peak memory, cold |")
          print("| --- | --- | --- | --- |")
          for b in ["musl-0.2.0", "musl-mimalloc", "glibc"]:
              mine = [r for r in rows if r["binary"] == b]
              cold = next(r for r in mine if r["run"] == "cold")
              warm = statistics.median(float(r["wall_s"]) for r in mine if r["run"] != "cold")
              print(f"| {b} | {float(cold['wall_s']):.1f} s | {warm:.2f} s | {cold['maxrss_mb']} MB |")
          PY
          cat "$GITHUB_STEP_SUMMARY"
