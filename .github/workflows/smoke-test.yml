# Runs each release binary on its own platform before anything is published.
# dist calls this after building the archives (`global-artifacts-jobs` in
# dist-workspace.toml), on version tags and pull requests; if it fails, the
# release isn't published.
name: Smoke test

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  smoke-test:
    name: smoke-test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, archive: tar.gz, npm: linux-x64 }
          - { target: aarch64-apple-darwin, runner: macos-15, archive: tar.gz, npm: darwin-arm64 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, archive: tar.gz, npm: darwin-x64 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, archive: zip, npm: win32-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            crates/ssqch/tests/fixtures
            npm
            scripts
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: artifacts
      - name: Unpack the binary
        run: |
          mkdir unpacked
          if [ "${{ matrix.archive }}" = zip ]; then
            unzip -q "artifacts/ssqch-${{ matrix.target }}.zip" -d unpacked
          else
            tar xzf "artifacts/ssqch-${{ matrix.target }}.tar.gz" -C unpacked
          fi
          bin=$(find unpacked -type f \( -name ssqch -o -name ssqch.exe \) | head -1)
          [ -n "$bin" ] || { echo "no ssqch binary in the archive"; find unpacked; exit 1; }
          cp "$bin" .
          ls -l ssqch*
      - name: The Linux binary is static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: file ssqch | tee /dev/stderr | grep -q "static"
      - name: The macOS binary is the right architecture
        if: runner.os == 'macOS'
        run: |
          file ssqch | tee /dev/stderr
          case "${{ matrix.target }}" in
            aarch64-*) file ssqch | grep -q arm64 ;;
            x86_64-*) file ssqch | grep -q x86_64 ;;
          esac
      - name: ssqch --version
        run: ./ssqch --version | grep -E "^ssqch [0-9]+\.[0-9]+\.[0-9]+"
      - name: Build a small site with images
        run: |
          mkdir -p site/src/img
          cp crates/ssqch/tests/fixtures/squatch.png site/src/img/
          cat > site/ssqch.config.js <<'JS'
          import { defineConfig } from "ssqch";
          import { imagePlugin } from "ssqch/image";
          import { linksPlugin } from "ssqch/links";
          export default defineConfig({
            dirs: { input: "src", output: "dist" },
            filters: { shout: (s) => s.toUpperCase() },
            plugins: [imagePlugin({ formats: ["avif", "webp", "auto"], widths: [16, 32] }), linksPlugin()],
          });
          JS
          printf -- '---\ntitle: smoke test\n---\n<h1>{{ shout(title) }}</h1>\n<a href="/img/squatch.png"><img src="/img/squatch.png" alt="Squatch"></a>\n' > site/src/index.jinja
          ./ssqch build --root site
          grep -q "<h1>SMOKE TEST</h1>" site/dist/index.html
          grep -q "<picture>" site/dist/index.html
          ls site/dist/img
          ls site/dist/img/*.avif site/dist/img/*.webp > /dev/null
      - name: The npm package installs and runs it
        run: |
          # Build the wrapper and this platform's package from the archive (the publish
          # job builds all four), then install them the way a site would.
          version=$(./ssqch --version | cut -d' ' -f2)
          node scripts/npm-packages.mjs --archives artifacts --out npm-out --version "$version" --only "${{ matrix.npm }}"
          mkdir tarballs
          for pkg in npm-out/*; do (cd "$pkg" && npm pack --silent --pack-destination ../../tarballs); done
          ls -l tarballs
          tarballs=$(cd tarballs && { pwd -W 2>/dev/null || pwd; })
          mkdir npm-site
          cat > npm-site/package.json <<JSON
          {
            "private": true,
            "devDependencies": { "ssqch": "file:$tarballs/ssqch-$version.tgz" },
            "overrides": { "@ssqch/${{ matrix.npm }}": "file:$tarballs/ssqch-${{ matrix.npm }}-$version.tgz" }
          }
          JSON
          cat npm-site/package.json
          cp -r site/src site/ssqch.config.js npm-site/
          cd npm-site
          npm install --no-audit --no-fund
          npx ssqch --version | grep -E "^ssqch [0-9]+\.[0-9]+\.[0-9]+"
          npx ssqch build --quiet
          grep -q "<h1>SMOKE TEST</h1>" dist/index.html
